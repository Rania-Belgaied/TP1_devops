services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REDIS_HOST: db-service 
      REDIS_PORT: 6379
    ports:
      - "${WEB_PORT}:5000"
    depends_on:
      - db-service 
    networks:
      - app-network

  db-service:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis-data: